# # PART 1 — Name of your pipeline
# name: CI/CD Pipeline

# # PART 2 — When should this run?
# on:
#   push:
#     branches: [main]

# # PART 3 — What should it do? (called "jobs")
# jobs:
#   my-first-job:
#     runs-on: ubuntu-latest   # use GitHub's computer
#     steps:
#       - name: Say hello
#         run: echo "Hello World"

name: Insight Copilot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ./backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_PATH: /tmp/test.duckdb
          HISTORY_DB_PATH: /tmp/history.sqlite
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -v --tb=short

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint check
        working-directory: ./frontend
        run: npm run lint

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: insight-copilot-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: insight-copilot-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"