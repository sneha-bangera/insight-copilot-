upstream backend_servers {
    server backend:8000;   # Docker Compose will fan this out
}                          # when you --scale backend=3

server {
    listen 80;

    # Route /api/* and all FastAPI paths to backend load balancer
    location ~ ^/(query|upload|history|status|tables|export|explain|health) {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # LLM calls can be slow
    }

    # Everything else → Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}